server.port=0

# 数据源配置 - 方案2c: BeanPostProcessor 自动解密
# DataSourcePasswordProcessor 会自动拦截并解密占位符密码
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:${user.home}/.dbpwd/h2_data/dbpwd_spring_boot_demo;IFEXISTS=TRUE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=@spring_boot_db@
