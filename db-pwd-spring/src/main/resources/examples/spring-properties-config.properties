# Spring属性配置文件示例
# 对于传统Spring应用使用PlaceholderConfigurer + XML/Java配置

# 数据库连接配置
db.url=jdbc:mysql://localhost:3306/mydb
db.username=root
# 使用ENC(SM4-GCM:xxx)格式的加密密码，通过@Value注入
db.password=ENC(SM4-GCM:your-encrypted-password-here)
db.driver=com.mysql.cj.jdbc.Driver

# 连接池配置
db.initialSize=5
db.maxActive=20
db.maxWait=60000

# 密码文件配置（可选）
dbpwd.keyFilePath=/path/to/.dbpwd/sm4.key
dbpwd.pwdFilePath=/path/to/.dbpwd/db.pwd
